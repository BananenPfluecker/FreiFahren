<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>FreiFahren Dortmund · Testkarte</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>html,body{height:100%;margin:0;overflow:hidden}#map{height:100%;width:100%}body{font:15px system-ui,sans-serif;background:#141820;color:white}#map{position:absolute;inset:0}.panel{position:absolute;z-index:1000;top:12px;left:12px;right:12px;max-width:380px;padding:14px;background:#171c25f2;border-radius:14px;box-shadow:0 6px 24px #0005}h1{font-size:19px;margin:0 0 6px}.note{font-size:12px;color:#cad2df;margin:0 0 10px}input,select{box-sizing:border-box;width:100%;padding:10px;margin:4px 0;border-radius:8px;border:1px solid #536072;background:#252e3d;color:white}#status{font-size:12px;margin:8px 0 0}.panel{box-sizing:border-box;max-height:55dvh;overflow:auto}#results{display:grid;gap:4px;max-height:150px;overflow:auto;margin-top:8px}#results:empty{display:none}button{font:inherit;cursor:pointer}#results button,#reset{padding:8px;border:1px solid #536072;border-radius:8px;background:#252e3d;color:white;text-align:left}#reset{margin-top:6px}input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid #80caff;outline-offset:2px}.leaflet-container{background:#dce7ef}.leaflet-popup-content{color:#17212e}@media(min-width:700px){.panel{right:auto;width:360px}}</style></head>
<body><div id="map" role="application" aria-label="Karte der Dortmunder Haltestellen und Linien"></div>
<section class="panel"><h1>FreiFahren Dortmund <small>Test</small></h1><p class="note">VRR-Sollfahrplandaten · keine Live-Meldungen. Durchgezogen: GTFS-Streckenverlauf. Gestrichelt: schematische Verbindung zwischen Haltestellen.</p><input id="search" type="search" placeholder="Haltestelle oder Linie suchen" aria-label="Suche"><select id="mode" aria-label="Verkehrsmittel"><option value="">Alle Verkehrsmittel</option><option value="light_rail">Stadtbahn</option><option value="bus">Bus</option><option value="train">S-Bahn</option></select><button id="reset" type="button">Ansicht zurücksetzen</button><div id="results" aria-label="Suchtreffer"></div><p id="geometry-status" class="note" role="status"></p><div id="status" role="status" aria-live="polite">Lade Fahrplandaten …</div></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script><script src="./app.js" defer></script></body></html>
